{% extends "base.html" %}
{% block title %}Log Workout – {{ name }}{% endblock %}
{% block body %}
<div class="layout">
  <fieldset class="panel" style="flex: 0 1 460px">
    <legend> Log Workout – {{ name }} </legend>
    <form method="post" action="{{ url_for('log_workout_page', client=name) }}">
      <label for="date">Date (YYYY-MM-DD)</label>
      <input id="date" name="date" type="date" value="{{ values.date }}">

      <label for="workout_type">Workout Type</label>
      <select id="workout_type" name="workout_type">
        <option value="" {% if not values.workout_type %}selected{% endif %}>-- choose --</option>
        {% for t in workout_types %}
        <option value="{{ t }}" {% if t == values.workout_type %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>

      <label for="duration_min">Duration (min)</label>
      <input id="duration_min" name="duration_min" type="number" min="0" step="1" value="{{ values.duration_min }}">

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="4">{{ values.notes }}</textarea>

      <label for="ex_name">Exercise Name</label>
      <input id="ex_name" name="ex_name" type="text" value="{{ values.ex_name }}">

      <label for="ex_sets">Sets</label>
      <input id="ex_sets" name="ex_sets" type="number" min="0" step="1" value="{{ values.ex_sets }}">

      <label for="ex_reps">Reps</label>
      <input id="ex_reps" name="ex_reps" type="number" min="0" step="1" value="{{ values.ex_reps }}">

      <label for="ex_weight">Weight (kg)</label>
      <input id="ex_weight" name="ex_weight" type="number" min="0" step="0.5" value="{{ values.ex_weight }}">

      <button class="btn" type="submit">Save Workout</button>
      <a class="btn secondary" href="{{ url_for('index', client=name) }}">Back</a>
    </form>
  </fieldset>
</div>
{% endblock %}
{% block status %}{% include "_status.html" %}{% endblock %}
