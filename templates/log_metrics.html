{% extends "base.html" %}
{% block title %}Log Body Metrics – {{ name }}{% endblock %}
{% block body %}
<div class="layout">
  <fieldset class="panel" style="flex: 0 1 380px">
    <legend> Log Body Metrics – {{ name }} </legend>
    <form method="post" action="{{ url_for('log_metrics_page', client=name) }}">
      <label for="date">Date (YYYY-MM-DD)</label>
      <input id="date" name="date" type="date" value="{{ values.date }}">

      <label for="weight">Weight (kg)</label>
      <input id="weight" name="weight" type="number" min="0" step="0.1" value="{{ values.weight }}">

      <label for="waist">Waist (cm)</label>
      <input id="waist" name="waist" type="number" min="0" step="0.1" value="{{ values.waist }}">

      <label for="bodyfat">Bodyfat (%)</label>
      <input id="bodyfat" name="bodyfat" type="number" min="0" step="0.1" value="{{ values.bodyfat }}">

      <button class="btn" type="submit">Save Metrics</button>
      <a class="btn secondary" href="{{ url_for('index', client=name) }}">Back</a>
    </form>
  </fieldset>
</div>
{% endblock %}
{% block status %}{% include "_status.html" %}{% endblock %}
