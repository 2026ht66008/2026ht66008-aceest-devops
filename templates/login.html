{% extends "base.html" %}
{% block title %}ACEest Login{% endblock %}
{% block header %}ACEest Fitness &amp; Performance{% endblock %}
{% block body %}
<div class="login-box">
  <h2>ACEest Login</h2>
  <fieldset class="panel">
    <legend> Sign in </legend>
    <form method="post" action="{{ url_for('login_screen') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">

      <div class="btn-col"><button class="btn" type="submit">Login</button></div>
    </form>
  </fieldset>
</div>
{% endblock %}
