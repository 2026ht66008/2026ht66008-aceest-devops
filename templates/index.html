{% extends "base.html" %}
{% block body %}
<div class="layout">
  <!-- LEFT PANEL -->
  <aside class="left">
    <fieldset class="panel">
      <legend> Client Management </legend>
      <form method="post" action="{{ url_for('save_client_form') }}">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ form.name }}">

        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" step="1" value="{{ form.age }}">

        <label for="weight">Weight (kg)</label>
        <input id="weight" name="weight" type="number" min="0" step="0.1" value="{{ form.weight }}">

        <label for="program">Program</label>
        <select id="program" name="program">
          <option value="" {% if not form.program %}selected{% endif %}>-- choose a program --</option>
          {% for name in programs %}
          <option value="{{ name }}" {% if name == form.program %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>

        <label for="adherence">Weekly Adherence %:
          <output class="range-value" id="adherence-value">{{ form.adherence or 0 }}</output></label>
        <input id="adherence" name="adherence" type="range" min="0" max="100" step="1"
               value="{{ form.adherence or 0 }}"
               oninput="document.getElementById('adherence-value').value = this.value">

        <div class="btn-col">
          <button class="btn" type="submit">Save Client</button>
          <button class="btn" type="submit" formaction="{{ url_for('load_client_form') }}">Load Client</button>
          <button class="btn" type="submit" formaction="{{ url_for('save_progress_form') }}">Save Progress</button>
          <button class="btn" type="submit" formaction="{{ url_for('show_progress_chart_form') }}">View Progress Chart</button>
        </div>
      </form>
    </fieldset>
  </aside>

  <!-- RIGHT PANEL -->
  <section class="right">
    <fieldset class="panel">
      <legend> Client Summary </legend>
      {% if summary %}
      <pre class="display">{{ summary }}</pre>
      {% else %}
      <pre class="display placeholder">Save or load a client to see the summary</pre>
      {% endif %}
    </fieldset>

    {% if show_chart %}
    <fieldset class="panel chart">
      <legend> Weekly Adherence Progress </legend>
      <img src="{{ url_for('api_show_progress_chart', name=form.name) }}" alt="Line chart of weekly adherence for {{ form.name }}" width="800" height="400">
    </fieldset>
    {% endif %}
  </section>
</div>
{% endblock %}
