{% extends "base.html" %}
{% block title %}Add Workout - {{ name }}{% endblock %}
{% block header %}ACEest Dashboard ({{ role }}){% endblock %}
{% block body %}
<div class="layout">
  <fieldset class="panel" style="flex: 0 1 420px">
    <legend> Add Workout - {{ name }} </legend>
    <form method="post" action="{{ url_for('add_workout_page', client=name) }}">
      <label for="date">Date (YYYY-MM-DD)</label>
      <input id="date" name="date" type="date" value="{{ values.date }}">

      <label for="workout_type">Type</label>
      <select id="workout_type" name="workout_type">
        <option value="" {% if not values.workout_type %}selected{% endif %}>-- choose --</option>
        {% for t in workout_types %}
        <option value="{{ t }}" {% if t == values.workout_type %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>

      <label for="duration_min">Duration (min)</label>
      <input id="duration_min" name="duration_min" type="number" min="0" step="1" value="{{ values.duration_min }}">

      <label for="notes">Notes</label>
      <input id="notes" name="notes" type="text" value="{{ values.notes }}">

      <button class="btn" type="submit">Save</button>
      <a class="btn secondary" href="{{ url_for('index', client=name, tab='workouts') }}">Back</a>
    </form>
  </fieldset>
</div>
{% endblock %}
